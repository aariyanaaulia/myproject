        <style>
        .btn {
            display: inline-block;
            padding: 18px 28px;

            background: whitesmoke;
            text-decoration: none;
            color: black;
            border-radius: 15px;

        }

        .btn:active {

        <br clear="all">

        <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1c6e1;
        }

        .header {
            background-image: url('white.jpg');
            background-size: cover;
            background-position: center;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header h1 {
            font-size: 70px;
            color: pink;
            text-align: center;
            font-weight: bold;
            -webkit-text-stroke: 3px hotpink;
            text-shadow: 4px 4px lightpink;
            margin: 0;
        }

        .nav {
            background-color: #f6a9c9;
            text-align: center;
            padding: 15px;
        }

        .nav a {
            margin: 0 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            font-family: 'Titan One', sans-serif;
            font-size: 40px;
            color: #983469;
            margin-top: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.5cm;
            max-width: 1500px;
            margin: 0 auto;
        }

        .gallery img {
            width: 90%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid whitesmoke;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .footer {
            max-width: 1500px;
            margin: 30px auto;
            text-align: center;
            font-size: 16px;
        }

        @media (max-width: 500px) {
            h2 {
                font-size: 24px;
            }

            .gallery img {
                height: 300px;
            }
        }
        </style>
